name: Deploy • librewxr.seeyou.cloud

# Deploys the selected branch to h03 CT 115 with scripts/deploy.sh — the same
# script and the same settings (deploy/librewxr.env) a laptop deploy uses. The
# script asks the deploy lock (lock.sh on the api box) first, so this refuses
# rather than replacing what someone deployed from their laptop — unless you
# force it. Runs on the Linux office runner, whose key the box accepts.

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Deploy anyway — over another branch, someone's uncommitted changes, or newer commits"
        type: boolean
        default: false

# Queue runs of this workflow rather than letting them deploy over each other.
concurrency:
  group: deploy-librewxr
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4

      - name: Deploy
        env:
          FORCE: ${{ inputs.force && 'true' || 'false' }}
        run: scripts/deploy.sh
