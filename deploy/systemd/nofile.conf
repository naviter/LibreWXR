# Raise the fd soft limit (default 1024) — multi-mode memmaps + the shared
# coord/tile stores hold hundreds of fds per process, and the incremental
# state apply leaks fds of replaced memmaps until the ceiling (EMFILE broke
# state applies 2026-08-11, radar froze at 13:40Z). Upstream sets 65536 in
# Docker (b25718e); systemd units need it separately.
[Service]
LimitNOFILE=65536
